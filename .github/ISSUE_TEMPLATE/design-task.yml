name: Design Task
description: UI/UX task, created during In Preparation
title: "[DESIGN] "
# NOTE: this template deliberately applies NO `agent:*` routing label.
# Routing labels are what the poller dispatches on — applying one at
# creation makes an issue eligible for pickup before its gating
# conditions are met (e.g. a QA task picked up before its dev tasks
# merged, or a blocked dev task dispatched early). Agents/scripts apply
# `agent:*` deliberately when the work is actually ready.
labels: ["type:design-task"]
body:
  - type: input
    id: parent-story
    attributes:
      label: Parent User Story
      description: Issue number (e.g. #124)
    validations:
      required: true
  - type: textarea
    id: screens
    attributes:
      label: Screens Needed
  - type: dropdown
    id: verdict
    attributes:
      label: Design Verdict (Tech Lead)
      description: >-
        Set by the Tech Lead at breakdown. `spec` cites the components, classes
        and tokens that already exist. `open-design` drives Open Design for a
        real visual artifact, and the Tech Lead must ALSO apply the
        `design:net-new` label — that label, not this field, is what
        scripts/uiux-mockup.sh reads.
      options:
        - "spec — change to a screen that already exists"
        - "spec + token check — needs a component that does not exist yet"
        - "open-design — a screen that does not exist yet"
    validations:
      required: true
  - type: textarea
    id: verdict-reason
    attributes:
      label: Why (one line)
      description: >-
        The reason for the verdict. "Net-new" is not a reason; "the payslip
        archive has no existing equivalent in the admin shell" is.
    validations:
      required: true
  - type: textarea
    id: tokens
    attributes:
      label: Design Tokens Needed
      description: New or modified tokens this task requires, if any
  - type: input
    id: output-link
    attributes:
      label: Output Link
      description: Filled by UI/UX once produced — docs/design/mockups/issue-<n>/ path (and the Open Design link in open-design mode)