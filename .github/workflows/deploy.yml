# Production deploy pipeline. Triggered by the `agent:deploy` poll.sh lane via
# `gh workflow run deploy.yml --ref master` (also runnable manually from the
# Actions tab). See infra/DEPLOYMENT.md §7 and
# docs/adr/0009-deployment-architecture.md.
#
# Requires these repository variables (Settings → Secrets and variables →
# Actions → Variables), all sourced from `pulumi stack output` after
# `infra/` has been applied once (see infra/README.md):
#   AWS_REGION            e.g. ap-southeast-1
#   AWS_DEPLOY_ROLE_ARN   githubDeployRoleArn output
#   EC2_INSTANCE_ID       ec2InstanceId output
#   SPA_BUCKET            spaBucketName output
#   API_REPOSITORY_URL    apiRepositoryUrl output
#   SITE_URL              siteUrl output (CloudFront domain, https://...)
#   CLOUDFRONT_DISTRIBUTION_ID  cloudfrontDistributionId output
#
# No AWS access keys are stored anywhere — auth is via GitHub OIDC, scoped in
# infra/oidc.ts to this repo + the master branch only.
name: Deploy

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-api-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: image
        name: Resolve API image
        env:
          REPOSITORY_URL: ${{ vars.API_REPOSITORY_URL }}
        run: |
          set -euo pipefail

          REPOSITORY_NAME="${REPOSITORY_URL#*/}"
          IMAGE="${REPOSITORY_URL}:${GITHUB_SHA}"
          ERROR_FILE="$(mktemp)"

          cleanup() {
            rm -f "$ERROR_FILE"
          }

          trap cleanup EXIT

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

          if aws ecr describe-images \
            --repository-name "$REPOSITORY_NAME" \
            --image-ids "imageTag=${GITHUB_SHA}" \
            --no-cli-pager \
            >/dev/null 2>"$ERROR_FILE"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "api_image=existing"
          elif grep -q "ImageNotFoundException" "$ERROR_FILE"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "api_image=build-required"
          else
            cat "$ERROR_FILE" >&2
            exit 1
          fi
      - uses: aws-actions/amazon-ecr-login@v2
        if: steps.image.outputs.exists != 'true'
      - uses: docker/setup-qemu-action@v3
        if: steps.image.outputs.exists != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.image.outputs.exists != 'true'
      - uses: docker/build-push-action@v6
        if: steps.image.outputs.exists != 'true'
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.image }}

  build-spa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build SPA (same-origin — VITE_API_URL is a relative path)
        run: pnpm --filter @coffee-shop/shared build && pnpm --filter @coffee-shop/web build
        env:
          VITE_API_URL: /api
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload SPA build to S3
        run: |
          aws s3 sync \
            apps/web/dist \
            "s3://${{ vars.SPA_BUCKET }}/spa/" \
            --delete \
            --no-cli-pager

  deploy-to-instance:
    needs: [build-api-image, build-spa]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload deployment configuration to S3
        run: |
          set -euo pipefail

          aws s3 cp \
            docker-compose.yml \
            "s3://${{ vars.SPA_BUCKET }}/deploy-config/docker-compose.yml" \
            --no-cli-pager

          aws s3 cp \
            deploy/nginx.conf \
            "s3://${{ vars.SPA_BUCKET }}/deploy-config/nginx.conf" \
            --no-cli-pager

          aws s3 cp \
            deploy/remote-deploy.sh \
            "s3://${{ vars.SPA_BUCKET }}/deploy-config/remote-deploy.sh" \
            --no-cli-pager
      - name: Run deploy commands on the instance via SSM (no SSH)
        env:
          API_IMAGE: ${{ needs.build-api-image.outputs.image }}
        run: |
          set -euo pipefail
          PARAMETERS="$(
            jq -n \
              --arg bucket "${{ vars.SPA_BUCKET }}" \
              --arg image "$API_IMAGE" \
              '{
                commands: [
                  "set -euo pipefail",
                  "install -d -o root -g root -m 0755 /opt/coffee-shop-pos/deploy",
                  (
                    "aws s3 cp "
                    + ("s3://" + $bucket + "/deploy-config/remote-deploy.sh" | @sh)
                    + " /opt/coffee-shop-pos/deploy/remote-deploy.sh --no-cli-pager"
                  ),
                  "chmod 0755 /opt/coffee-shop-pos/deploy/remote-deploy.sh",
                  (
                    "/opt/coffee-shop-pos/deploy/remote-deploy.sh "
                    + ($bucket | @sh)
                    + " "
                    + ($image | @sh)
                  )
                ]
              }'
          )"

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
              --document-name "AWS-RunShellScript" \
              --comment "coffee-shop-pos deploy ${{ github.sha }}" \
              --parameters "$PARAMETERS" \
              --query "Command.CommandId" \
              --output text \
              --no-cli-pager
          )"

          echo "SSM command: $COMMAND_ID"

          FINAL_STATUS=""

          for attempt in $(seq 1 60); do
            STATUS="$(
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                --query "Status" \
                --output text \
                --no-cli-pager 2>/dev/null ||
              echo "Pending"
            )"

            echo "attempt=${attempt} status=${STATUS}"

            case "$STATUS" in
              Success)
                FINAL_STATUS="$STATUS"
                break
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                FINAL_STATUS="$STATUS"
                break
                ;;

              Pending|InProgress|Delayed)
                sleep 10
                ;;

              *)
                echo "ERROR: Unexpected SSM status: $STATUS" >&2
                FINAL_STATUS="$STATUS"
                break
                ;;
            esac
          done

          echo
          echo "== SSM standard output =="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text \
            --no-cli-pager || true

          echo
          echo "== SSM standard error =="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "StandardErrorContent" \
            --output text \
            --no-cli-pager || true

          if [[ "$FINAL_STATUS" != "Success" ]]; then
            echo "ERROR: Deployment command ended with status: ${FINAL_STATUS:-poll-timeout}" >&2
            exit 1
          fi

          echo "ssm_deployment=passed"

      - name: Invalidate CloudFront cache
        run: |
          set -euo pipefail

          # The SPA entry document can already be cached under every deep-link
          # path from deployments made before it became non-cacheable. Clear
          # all of those edge entries; Vite's content-hashed assets remain safe
          # to cache and the wildcard counts as one invalidation path.
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --no-cli-pager

      - name: Health check
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            echo "health_check_attempt=${attempt}"
            if curl -fsS "${{ vars.SITE_URL }}/api/health"; then
              echo "healthy"
              exit 0
            fi
            sleep 5
          done
          echo "health check never passed" >&2
          exit 1
