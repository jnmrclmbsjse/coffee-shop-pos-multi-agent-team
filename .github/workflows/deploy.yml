# Production deploy pipeline. Triggered by the `agent:deploy` poll.sh lane via
# `gh workflow run deploy.yml --ref master` (also runnable manually from the
# Actions tab). See infra/DEPLOYMENT.md §7 and
# docs/adr/0009-deployment-architecture.md.
#
# Requires these repository variables (Settings → Secrets and variables →
# Actions → Variables), all sourced from `pulumi stack output` after
# `infra/` has been applied once (see infra/README.md):
#   AWS_REGION            e.g. ap-southeast-1
#   AWS_DEPLOY_ROLE_ARN   githubDeployRoleArn output
#   EC2_INSTANCE_ID       ec2InstanceId output
#   SPA_BUCKET            spaBucketName output
#   SITE_URL              siteUrl output (CloudFront domain, https://...)
#
# No AWS access keys are stored anywhere — auth is via GitHub OIDC, scoped in
# infra/oidc.ts to this repo + the master branch only.
name: Deploy

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-api-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "image=ghcr.io/${{ github.repository }}-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image }}

  build-spa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build SPA (same-origin — VITE_API_URL is a relative path)
        run: pnpm --filter @coffee-shop/shared build && pnpm --filter @coffee-shop/web build
        env:
          VITE_API_URL: /api
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload SPA build to S3
        run: aws s3 sync apps/web/dist "s3://${{ vars.SPA_BUCKET }}" --delete

  deploy-to-instance:
    needs: [build-api-image, build-spa]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Run deploy commands on the instance via SSM (no SSH)
        env:
          API_IMAGE: ${{ needs.build-api-image.outputs.image }}
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "coffee-shop-pos deploy ${{ github.sha }}" \
            --parameters commands="[
              \"set -euxo pipefail\",
              \"cd /opt/coffee-shop-pos\",
              \"aws s3 sync s3://${{ vars.SPA_BUCKET }} /var/www/spa --delete\",
              \"export API_IMAGE=${API_IMAGE}\",
              \"docker compose pull\",
              \"docker compose run --rm api npx prisma migrate deploy\",
              \"docker compose up -d\"
            ]" \
            --query "Command.CommandId" --output text)

          echo "SSM command: $COMMAND_ID"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                  --query "StandardOutputContent,StandardErrorContent" --output text
                exit 1
                ;;
            esac
            sleep 10
          done

      - name: Health check
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            if curl -fsS "${{ vars.SITE_URL }}/health"; then
              echo "healthy"
              exit 0
            fi
            sleep 5
          done
          echo "health check never passed" >&2
          exit 1
