# Production compose file for the single-EC2 deployment shape.
# See docs/adr/0009-deployment-architecture.md and infra/DEPLOYMENT.md.
#
# Not used for local development — apps/api and apps/web run directly via
# `pnpm dev` for that (see root package.json). This file only runs on the box.
#
# The deploy pipeline (.github/workflows/deploy.yml) renders `.env` from SSM
# Parameter Store before `docker compose up`, and separately runs
# `docker compose run --rm api npx prisma migrate deploy` before bringing the
# API up on each deploy — migrations are not applied automatically by `up`.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/www/spa:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  pgdata:
