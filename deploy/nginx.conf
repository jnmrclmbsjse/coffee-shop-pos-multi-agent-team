# Same-origin front door: SPA static files at / , API reverse-proxied at
# /api/* with the prefix stripped. See docs/adr/0009-deployment-architecture.md
# for why same-origin matters (SameSite=Lax cookie, no CORS).

server {
    listen 80;
    server_name _;

    # CloudFront terminates TLS and forwards plain HTTP here — this is the
    # deliberate origin-protocol choice documented in infra/edge.ts.

    location /health {
        proxy_pass http://api:3000/health;
    }

    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # The SPA entry document must be revalidated on every request. Deep-link
    # fallbacks internally redirect here, so this also covers /dashboard,
    # /catalog/products, /pos/order, and every other client-side route without
    # weakening the cacheability of Vite's content-hashed assets.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA client-side routing: fall back to index.html for unknown paths.
        try_files $uri $uri/ /index.html;
    }
}
